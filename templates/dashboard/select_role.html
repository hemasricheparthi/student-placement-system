<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select User Type - Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #faf9fc;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            padding: 1.5rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .top-bar .brand {
            display: flex; align-items: center; gap: 0.6rem;
            font-weight: 700; color: #2d1b4e; font-size: 1.05rem;
        }
        .top-bar .icon-badge {
            width: 34px; height: 34px; border-radius: 8px;
            background: #6f42c1; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem;
        }
        .back-link { color: #6f42c1; text-decoration: none; font-weight: 600; font-size: 0.88rem; }
        .back-link:hover { color: #4c2d85; }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem 4rem 1.5rem;
        }
        .header-block { text-align: center; margin-bottom: 2.5rem; }
        .header-block h1 { font-weight: 800; font-size: clamp(1.5rem, 4vw, 2rem); color: #241536; margin-bottom: 0.4rem; }
        .header-block p { color: #8a7a9e; font-size: 0.98rem; margin: 0; }

        .role-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 560px;
            width: 100%;
        }
        .role-row {
            background: #fff;
            border-radius: 12px;
            border: 1.5px solid #ede3fa;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.1rem;
            text-decoration: none;
            transition: all 0.18s ease;
        }
        .role-row:hover {
            border-color: #6f42c1;
            box-shadow: 0 8px 24px rgba(111,66,193,0.12);
            transform: translateX(4px);
        }
        .role-row .role-icon {
            width: 50px; height: 50px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            flex-shrink: 0;
        }
        .role-row.student .role-icon { background: #6f42c1; }
        .role-row.company .role-icon { background: #4c2d85; }
        .role-row.admin .role-icon { background: #2d1b4e; }

        .role-row .role-text { flex: 1; }
        .role-row .role-text h3 { font-weight: 700; color: #241536; margin-bottom: 0.15rem; font-size: 1.02rem; }
        .role-row .role-text p { color: #8a7a9e; font-size: 0.85rem; margin: 0; }
        .role-row .role-arrow { color: #c3b3e0; font-size: 1.2rem; }
        .role-row:hover .role-arrow { color: #6f42c1; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="brand">
            <div class="icon-badge"><i class="bi bi-mortarboard-fill"></i></div>
            Placement Portal
        </div>
        <a href="{% url 'dashboard:home' %}" class="back-link"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    <div class="content-area">
        <div class="header-block">
            <h1>Welcome to Placement Portal</h1>
            <p>Choose how you'd like to continue</p>
        </div>

        <div class="role-list">
            <a href="{% url 'accounts:student_login' %}" class="role-row student">
                <div class="role-icon"><i class="bi bi-mortarboard-fill"></i></div>
                <div class="role-text">
                    <h3>Student</h3>
                    <p>Login to view opportunities and apply for jobs.</p>
                </div>
                <i class="bi bi-chevron-right role-arrow"></i>
            </a>

            <a href="{% url 'accounts:company_login' %}" class="role-row company">
                <div class="role-icon"><i class="bi bi-building"></i></div>
                <div class="role-text">
                    <h3>Company</h3>
                    <p>Login to manage job postings and recruitment.</p>
                </div>
                <i class="bi bi-chevron-right role-arrow"></i>
            </a>

            <a href="{% url 'accounts:admin_login' %}" class="role-row admin">
                <div class="role-icon"><i class="bi bi-shield-lock-fill"></i></div>
                <div class="role-text">
                    <h3>Admin</h3>
                    <p>Manage students, companies, placements, and reports.</p>
                </div>
                <i class="bi bi-chevron-right role-arrow"></i>
            </a>
        </div>
    </div>
</body>
</html>
