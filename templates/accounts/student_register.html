<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }
        body {
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #faf9fc;
            background-image: linear-gradient(#ede3fa 1px, transparent 1px), linear-gradient(90deg, #ede3fa 1px, transparent 1px);
            background-size: 36px 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 1.25rem 2rem;
            display: flex; align-items: center; gap: 0.6rem;
            font-weight: 700; color: #2d1b4e; font-size: 1.05rem;
        }
        .top-bar .icon-badge {
            width: 34px; height: 34px; border-radius: 8px;
            background: #6f42c1; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem;
        }
        .register-card {
            width: 100%;
            max-width: 760px;
            background: #fff;
            border-radius: 16px;
            border: 1px solid #ede3fa;
            padding: 2.25rem;
            box-shadow: 0 4px 20px rgba(76,45,133,0.06);
            margin-top: 3.5rem;
        }
        .register-header { text-align: center; margin-bottom: 1.75rem; }
        .register-header .role-icon {
            width: 52px; height: 52px; border-radius: 12px;
            background: #6f42c1; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; margin: 0 auto 0.85rem auto;
        }
        .register-header h2 { font-weight: 700; font-size: 1.4rem; color: #241536; margin-bottom: 0.2rem; }
        .register-header p { color: #8a7a9e; font-size: 0.88rem; margin: 0; }

        .form-label { font-weight: 600; font-size: 0.83rem; color: #4c2d85; }
        .form-control, .form-select {
            border-radius: 8px; border: 1.5px solid #e6def5;
            padding: 0.55rem 0.85rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #6f42c1; box-shadow: 0 0 0 0.15rem rgba(111,66,193,0.12);
        }
        .btn-register {
            background: #6f42c1;
            border: none; border-radius: 8px;
            font-weight: 600; padding: 0.68rem;
        }
        .btn-register:hover { background: #4c2d85; }
        .footer-links { margin-top: 1.25rem; text-align: center; font-size: 0.85rem; color: #8a7a9e; }
        .footer-links a { color: #6f42c1; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="icon-badge"><i class="bi bi-mortarboard-fill"></i></div>
        Placement Portal
    </div>

    <div class="register-card">
        <div class="register-header">
            <div class="role-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <h2>Student Registration</h2>
            <p>Create your student account</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name <span class="text-danger">*</span></label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name <span class="text-danger">*</span></label>
                    <input type="text" name="last_name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone <span class="text-danger">*</span></label>
                    <input type="text" name="phone" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Enrollment No <span class="text-danger">*</span></label>
                    <input type="text" name="enrollment_no" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Department <span class="text-danger">*</span></label>
                    <select name="department" class="form-select" required>
                        {% for dept in form.department.field.queryset %}
                        <option value="{{ dept.pk }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Batch Year <span class="text-danger">*</span></label>
                    <input type="number" name="batch_year" class="form-control" value="2026" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">CGPA <span class="text-danger">*</span></label>
                    <input type="number" name="cgpa" class="form-control" step="0.01" value="0" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password1" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" name="password2" class="form-control" required>
                </div>
            </div>
            {% if form.errors %}
            <div class="alert alert-danger">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}<p class="mb-0">{{ error }}</p>{% endfor %}
                {% endfor %}
            </div>
            {% endif %}
            <button type="submit" class="btn btn-register w-100 text-white">Register</button>
        </form>
        <div class="footer-links">
            Already have an account? <a href="{% url 'accounts:student_login' %}">Login</a>
        </div>
    </div>
</body>
</html>
